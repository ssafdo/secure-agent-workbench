name: Container evidence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  container-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11"

      - name: Install Python package with retrieval runtime
        run: python -m pip install -e ".[retrieval]"

      - name: Download and verify pinned retrieval model
        env:
          PYTHONPATH: src
        run: >-
          python scripts/download_retrieval_model.py
          --output runtime/models/potion-multilingual-128M-i8

      - name: Benchmark lexical and hybrid retrieval
        env:
          PYTHONPATH: src
        run: >-
          python scripts/benchmark_retrieval.py
          --model-path runtime/models/potion-multilingual-128M-i8
          --require-improvement
          --output artifacts/retrieval/benchmark.json

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes binutils

      - name: Build static runner and scratch image
        shell: bash
        run: |
          set -euo pipefail
          as --64 containers/agent-runner.s -o /tmp/agent-runner.o
          ld -static -o containers/agent-runner /tmp/agent-runner.o
          docker build --file containers/runner.Dockerfile --tag secure-agent-runner:dev .

      - name: Run Python regression tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Run real container smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/container
          image_id="$(docker image inspect --format '{{.Id}}' secure-agent-runner:dev)"
          AGENT_WORKBENCH_CONTAINER_ENABLED=true \
          AGENT_WORKBENCH_CONTAINER_IMAGE="$image_id" \
          AGENT_WORKBENCH_CONTAINER_EXECUTABLES=agent-runner \
          PYTHONPATH=src \
          python -m agent_workbench container-smoke \
            | tee artifacts/container/container-smoke.json

      - name: Install NiceEval dependencies
        working-directory: niceeval
        run: pnpm install --frozen-lockfile

      - name: Run retrieval NiceEval gate
        shell: bash
        working-directory: niceeval
        run: |
          set -o pipefail
          mkdir -p ../artifacts/retrieval
          pnpm exec niceeval exp local research/retrieval --rerun all --json \
            --junit ../artifacts/retrieval/niceeval-junit.xml \
            | tee ../artifacts/retrieval/niceeval.ndjson
          exit "${PIPESTATUS[0]}"

      - name: Extract retrieval NiceEval receipt
        run: >-
          python scripts/extract_niceeval_receipt.py
          artifacts/retrieval/niceeval.ndjson

      - name: Run container NiceEval gate
        shell: bash
        working-directory: niceeval
        run: |
          set -o pipefail
          pnpm exec niceeval exp container container/smoke --rerun all --json \
            --junit ../artifacts/container/niceeval-junit.xml \
            | tee ../artifacts/container/niceeval.ndjson
          exit "${PIPESTATUS[0]}"

      - name: Extract NiceEval receipt
        id: receipt
        run: python scripts/extract_niceeval_receipt.py artifacts/container/niceeval.ndjson

      - name: Generate and verify evidence
        run: |
          python scripts/generate_container_evidence.py \
            --run-id "${{ steps.receipt.outputs.run_id }}"
          python scripts/verify_container_evidence.py --require-image

      - name: Upload container evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-evidence
          path: |
            artifacts/container/
            containers/agent-runner

      - name: Upload retrieval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-evidence
          path: artifacts/retrieval/

      - name: Attest build proof
        if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/container/build-proof.json

      - name: Attest runner SBOM
        if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
        uses: actions/attest-sbom@v2
        with:
          subject-path: containers/agent-runner
          sbom-path: artifacts/container/sbom.cdx.json

      - name: Report private repository attestation limitation
        if: github.event_name != 'pull_request' && github.event.repository.visibility != 'public'
        run: >-
          echo "::notice title=Attestation unavailable::GitHub artifact attestations are
          unavailable for user-owned private repositories. The verified evidence bundle
          is available as this run's container-evidence artifact."
