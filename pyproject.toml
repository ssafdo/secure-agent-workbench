[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-agent-workbench"
version = "0.13.0"
description = "A small, testable foundation for an isolated multi-agent workbench."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent-workbench = "agent_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_workbench = ["web/*.html", "web/*.css", "web/*.js"]
